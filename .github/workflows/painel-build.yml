# Build do fork "painel" (mmontanola/freekiosk), usado no painel de parede do
# projeto moto-e22-wallpanel. Compila o APK de release a partir do codigo, com a
# chave de assinatura do painel (segredos do repositorio; o original fica em
# /etc/freekiosk no servidor ubuntu-a1-free), e publica o APK com o SHA-256.
#
# O servidor do painel e ARM64 e as ferramentas do Android SDK so existem para
# x86_64; por isso o build roda aqui e nao la.
name: Painel build

on:
  workflow_dispatch:
  push:
    tags:
      - "painel-v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Dependencias JS
        run: npm ci

      - name: Assinatura
        env:
          KEYSTORE_B64: ${{ secrets.FREEKIOSK_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.FREEKIOSK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FREEKIOSK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FREEKIOSK_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "segredo FREEKIOSK_KEYSTORE_B64 ausente"; exit 1; }
          cp android/gradle.properties.template android/gradle.properties
          echo "$KEYSTORE_B64" | base64 -d > android/app/painel-release.keystore
          {
            echo "FREEKIOSK_UPLOAD_STORE_FILE=painel-release.keystore"
            echo "FREEKIOSK_UPLOAD_STORE_PASSWORD=$STORE_PASSWORD"
            echo "FREEKIOSK_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
            echo "FREEKIOSK_UPLOAD_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties

      - name: APK de release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Nome, verificacao da assinatura e SHA-256
        id: apk
        run: |
          versao=$(grep -m1 'versionName "' android/app/build.gradle | sed 's/.*versionName "\(.*\)".*/\1/')
          nome="freekiosk-${versao}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$nome"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$nome" | tee assinatura.txt
          grep -q "CN=FreeKiosk Painel" assinatura.txt || { echo "APK nao foi assinado com a chave do painel"; exit 1; }
          sha256sum "$nome" > "$nome.sha256"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nome }}
          path: |
            ${{ steps.apk.outputs.nome }}
            ${{ steps.apk.outputs.nome }}.sha256
            assinatura.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/painel-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.nome }}" "${{ steps.apk.outputs.nome }}.sha256" \
            --prerelease --title "$GITHUB_REF_NAME" \
            --notes-file PAINEL.md
